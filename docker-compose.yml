services:
  hotels_diplom:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - 3000:3000
    command: npm run start
    depends_on:
      - mongo-db
    environment:
      - MONGO_DB_CONNECTION=mongodb+srv://helena6421helena:COGzemQD3q6A4d09s@cluster0.tqzmb.mongodb.net/
  mongo-db:
    image: mongo:5.0
    ports:
      - 27017:27017
    volumes:
      - hotels-api-mongo-db:/data/db
  mongo-express:
    image: mongo-express:0.54
    ports:
      - 8080:8080
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo-db
volumes:
  hotels-api-mongo-db:
    driver: local
